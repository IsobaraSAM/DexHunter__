<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="argusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="50%" stop-color="#181336" />
      <stop offset="100%" stop-color="#091a18" />
    </linearGradient>
    <linearGradient id="argusRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="argusEye" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="argusIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#6ee7b7" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>
    <filter id="argusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#argusBg)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="url(#argusRing)" stroke-width="1.5" opacity="0.6" />

  <!-- Outer Orbital Aperture (Hooked v4 surveillance rings) -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#argusRing)" stroke-width="2" stroke-dasharray="8 6" opacity="0.45" />
  
  <!-- Outer Eye Contour -->
  <path d="M 18 64 C 36 34, 92 34, 110 64 C 92 94, 36 94, 18 64 Z" 
        fill="none" 
        stroke="url(#argusEye)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#argusGlow)" />

  <!-- Inner Diamond Core (The All-Seeing Aperture) -->
  <path d="M 64 36 L 90 64 L 64 92 L 38 64 Z" 
        fill="#0d1527" 
        stroke="url(#argusRing)" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Iris Circle with Neon Radial Gradient -->
  <circle cx="64" cy="64" r="18" fill="url(#argusIris)" filter="url(#argusGlow)" />

  <!-- Inner Pupil / Diamond Star -->
  <polygon points="64,49 68,64 83,64 71,73 75,87 64,78 53,87 57,73 45,64 60,64" fill="#0f172a" />
  <circle cx="64" cy="64" r="4.5" fill="#ffffff" />
</svg>
